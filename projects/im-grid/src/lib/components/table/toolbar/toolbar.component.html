<div>
  @if (label()) {
    <div
      class="label"
      >
      {{ label() }}
    </div>
  }
  @if (numberOfChecked() > 0 && !directMode()) {
    <button
      (click)="deleteRows.emit(numberOfChecked() > 1000)"
      nz-button
      >
      <i
        nz-icon
        nzType="delete"
      ></i>
      @if (numberOfChecked() > 1000) {
        Delete first 1000
      } @else {
        Delete
      }
    </button>
  }
</div>
<div class="toolbar-buttons">
  @if (allowExcel()) {
    <button
      (click)="exportAsExcel.emit()"
      nz-button
      >
      <i
        nz-icon
        nzType="file-excel"
      ></i>
      {{ translations.excel | translate }}
    </button>
  }
  @if (allowExcel()) {
    <nz-divider
      nzType="vertical"
    ></nz-divider>
  }
  <nz-radio-group
    name="size"
    [(ngModel)]="size"
    (ngModelChange)="changeSize.emit($event)"
    >
    <label
      [title]="translations.large | translate"
      nz-radio-button
      nzValue="default"
      >
      <i
        nz-icon
        nzType="menu"
      ></i>
    </label>
    <label
      [title]="translations.medium | translate"
      nz-radio-button
      nzValue="middle"
      >
      <i
        [nzRotate]="90"
        nz-icon
        nzType="pause"
      ></i>
    </label>
    <label
      [title]="translations.small | translate"
      nz-radio-button
      nzValue="small"
      >
      <i
        nz-icon
        nzType="line"
      ></i>
    </label>
  </nz-radio-group>
  @if (!directMode()) {
    <nz-divider
      nzType="vertical"
    ></nz-divider>
  }
  @if (!directMode()) {
    <button
      [disabled]="unsavedRowsLength() + deletedRowsLength() + newRowsLength() === 0"
      [title]="translations.discardChanges | translate"
      (click)="resetRows.emit()"
      nz-button
      >
      <i
        nz-icon
        nzType="rollback"
      ></i>
    </button>
  }
  @if (allowCreate()) {
    <nz-divider
      nzType="vertical"
    ></nz-divider>
  }
  @if (allowCreate()) {
    <button
      [title]="translations.createNew | translate"
      (click)="addRow.emit()"
      nz-button
      >
      <i
        nz-icon
        nzType="plus-circle"
      ></i>
    </button>
  }
  @if (!directMode()) {
    <nz-divider
      nzType="vertical"
    ></nz-divider>
  }
  @if (!directMode()) {
    <button
      [class.saveButton]="!loading() && (unsavedRowsLength() + deletedRowsLength() + newRowsLength() !== 0)"
      [disabled]="loading() || (unsavedRowsLength() + deletedRowsLength() + newRowsLength()) === 0"
      [title]="'New rows: ' + newRowsLength() + ' - Updated rows: ' + unsavedRowsLength() + ' - Deleted rows: ' + deletedRowsLength()"
      (click)="saveRows.emit()"
      nz-button
      >
      <i
        nz-icon
        nzType="save"
      ></i>
      {{ translations.save | translate }}
    </button>
  }
</div>
