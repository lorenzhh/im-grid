<div class="im-footer-status">
  <span>
    <strong>{{ rowsLength() }}</strong>
    @if (isFiltered()) {
      <span class="im-muted"> {{ texts().of }} {{ totalLength() }}</span>
    }
    <span class="im-muted"> {{ texts().records }}</span>
  </span>
  @if (selectedLength() > 0) {
    <span class="im-footer-dot"></span>
    <span class="im-footer-selected">
      <strong>{{ selectedLength() }}</strong>
      <span class="im-muted"> {{ texts().selected }}</span>
    </span>
  }
</div>

@if (showSearch()) {
  <im-search
    [columns]="columns()"
    [(value)]="searchTerm"
    [notIncludedColumns]="notIncludedColumns()"
    (filterRows)="filterRows.emit($event)"
  />
}
