<div>
  {{ translations.records | translate }}:
  <b>{{ rowsLength() }}</b>
</div>
<div class="table-filter-footer">
  @if (showExclude()) {
    <nz-select
      [(ngModel)]="notIncludedColumns"
      [nzPlaceHolder]="translations.excludeColumns | translate"
      (ngModelChange)="filterRows.emit($event)"
      nzNoAnimation
      nzMode="multiple"
      nzAllowClear
      >
      @for (column of columns(); track column.key) {
        <nz-option [nzLabel]="column.title | translate"
          [nzValue]="column"
         />
      }
    </nz-select>
  }
  <nz-divider nzType="vertical" />
  <nz-input-wrapper [formGroup]="filterForm()">
    <nz-icon nzInputSuffix nzType="search" />
    <input
      [placeholder]="translations.filter | translate"
      type="text"
      nz-input
      formControlName="search"
    />
  </nz-input-wrapper>
  </div>
