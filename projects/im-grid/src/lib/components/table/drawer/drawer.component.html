<nz-drawer
  [nzBodyStyle]="{ padding: '0px' }"
  nzWrapClassName="im-grid-drawer"
  [nzPlacement]="isRtl() ? 'left' : 'right'"
  [nzTitle]="title()"
  [nzVisible]="visible()"
  [nzWidth]="width"
  (nzOnClose)="closed.emit()"
>
  <div
    class="drawer-body"
    [nzMinWidth]="500"
    (nzResize)="onResize($event)"
    nz-resizable
    nzBounds="window"
    *nzDrawerContent
  >
    <nz-resize-handle [nzDirection]="isRtl() ? 'right' : 'left'">
      <div class="resize-wrap"></div>
    </nz-resize-handle>
    <div class="body-content">
      <div #content></div>
    </div>
  </div>
</nz-drawer>
